name: Tests

# Every branch and every PR. The previous version of this file only watched
# `master` and `*.x`, neither of which exists in this repository, so nothing
# ever ran.
on:
  push:
  pull_request:
  # Lets the deploy pipeline run this exact suite as its gate, instead of
  # maintaining a second copy that would quietly drift.
  workflow_call:

permissions:
  contents: read

# A push that supersedes another cancels its run — except on the deploy
# gate, where a cancelled suite must never look like a passed one.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.4 only: composer.lock resolves Symfony 8, which requires PHP
        # >= 8.4.1 — the 8.3 leg could not even install the lock file, so it
        # tested nothing. composer.json says ^8.4 to match, and the VPS
        # (deploy/provision.sh) installs 8.4.
        php: ['8.4']

    name: PHP ${{ matrix.php }}

    # The suite runs against real PostgreSQL, not sqlite: the schema depends on
    # SELECT ... FOR UPDATE row locks, partial unique indexes and jsonb.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: webtransaction
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: webtransaction_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U webtransaction"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # pdo_pgsql for the database; gd and zip are what phpspreadsheet
          # needs to read the supplier workbooks.
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, gd, intl, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The screen tests render Filament pages through the Vite theme; with
      # no manifest every one of them is a 500. This is also the build
      # check itself — a class the compiler cannot resolve fails here, not
      # on the VPS mid-deploy.
      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U webtransaction && exit 0
            sleep 2
          done
          echo "PostgreSQL never became ready" && exit 1

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: webtransaction_test
          DB_USERNAME: webtransaction
          DB_PASSWORD: secret
        run: php artisan migrate --force

      - name: Execute tests
        # Database credentials come from phpunit.xml; this step only needs the
        # service to be up, which the previous steps guaranteed.
        run: php artisan test

  static-analysis:
    runs-on: ubuntu-latest
    name: Lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_pgsql, gd, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Audit dependencies
        # Known advisories in the lock file fail the build. The day this
        # blocks a release for a transitive package is the day it worked.
        run: composer audit

      - name: Lint the deploy kit
        # bash -n catches the syntax error that would otherwise be found
        # halfway through provisioning a production server.
        run: |
          bash -n deploy/provision.sh
          bash -n deploy/deploy.sh
