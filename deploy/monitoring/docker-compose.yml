# Central's monitoring stack on the same VPS (deploy/monitoring/install.sh
# starts it): Grafana, Loki, Prometheus, Alloy and three exporters. Every
# service runs on the host network and listens on loopback only, so nothing
# is published past ufw (a published port would bypass it) and the exporters
# reach PostgreSQL and Redis, which listen on 127.0.0.1. Grafana is reached
# through Caddy at monitor.<domain> (deploy/Caddyfile). Images are pinned;
# the monthly checklist bumps them (docs/BLUE-TEAM.md).
name: central-monitoring

x-common: &common
  network_mode: host
  restart: unless-stopped
  # install.sh refuses to run without the file; optional here so `docker compose config`
  # can check this file from a checkout that has none.
  env_file:
    - path: .env
      required: false
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  grafana:
    <<: *common
    image: grafana/grafana:12.1.1
    user: "472"
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_ROOT_URL: https://monitor.${DOMAIN}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${GF_SMTP_HOST}
      GF_SMTP_USER: ${GF_SMTP_USER}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS}
      GF_SMTP_FROM_NAME: Central monitor
      GF_UNIFIED_ALERTING_ENABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  loki:
    <<: *common
    image: grafana/loki:3.5.3
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  prometheus:
    <<: *common
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9090
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  alloy:
    <<: *common
    image: grafana/alloy:v1.10.0
    # Root, to read the journal, Caddy's and the application's logs as they are.
    user: "0"
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/log/caddy:/var/log/caddy:ro
      - /srv/central/storage/logs:/srv/central/storage/logs:ro
      - /var/log/audit:/var/log/audit:ro

  node_exporter:
    <<: *common
    image: prom/node-exporter:v1.9.1
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
      - --collector.textfile.directory=/textfile
      - --collector.systemd
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node_exporter/textfile:/textfile:ro
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro

  postgres_exporter:
    <<: *common
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://monitor:${MONITOR_DB_PASSWORD}@127.0.0.1:5432/central?sslmode=disable
    command:
      - --web.listen-address=127.0.0.1:9187

  redis_exporter:
    <<: *common
    image: oliver006/redis_exporter:v1.74.0
    command:
      - --redis.addr=redis://127.0.0.1:6379
      - --web.listen-address=127.0.0.1:9121
      - --check-single-keys=${REDIS_QUEUE_KEY}

volumes:
  grafana-data:
  loki-data:
  prometheus-data:
  alloy-data:
