# Prometheus only scrapes; the alert rules live in Grafana (grafana/provisioning/alerting).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
  - job_name: postgres
    static_configs:
      - targets: ["127.0.0.1:9187"]
  - job_name: redis
    static_configs:
      - targets: ["127.0.0.1:9121"]
  - job_name: loki
    static_configs:
      - targets: ["127.0.0.1:3100"]
  - job_name: alloy
    static_configs:
      - targets: ["127.0.0.1:12345"]
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
