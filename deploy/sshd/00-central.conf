# Central's sshd settings. harden.sh installs this to /etc/ssh/sshd_config.d/
# and moves the image's 50-cloud-init.conf aside: sshd keeps the FIRST value
# it reads for a key, so this file sorts before everything else.
#
# Keys only, one user, no forwarding (the GitHub deploy runs one command over
# SSH and needs none). Three tries, thirty seconds, idle sessions dropped.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
AllowUsers central
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
