<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 664 686" role="img" aria-labelledby="markTitle">
  <title id="markTitle">PT Java Indo Intermechanika</title>
  <!--
    The mark alone, without the company name beneath it.

    The dark-mode twin of logo.svg: the same traced paths, filled with the
    light blue the panel theme uses for text on a dark ground. Navy on
    near-black disappears; this stays legible. Keep the two files' paths
    identical.

    The panel draws this at 1.75rem — twenty-eight pixels — and renders no
    wordmark beside it, so the name in the full lockup would be about four
    pixels of grey mush. The lockup (logo-lockup.svg) belongs on a letterhead.

    No `width` or `height` attribute on purpose. Every surface sets its own
    height and lets the viewBox scale it, and a fixed intrinsic size is what
    makes an SVG logo turn up the wrong size in the one place nobody checked.
  -->
  <path fill="#9bbefd" d="M0,686 L394,686 L394,160 C376,231 372,239 355,284 C291,446 167,594 0,686Z M529,78 L416,144 L416,686 L529,686Z M664,0 L552,64 L552,686 L664,686Z"/>
</svg>
